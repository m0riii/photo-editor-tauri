name: Extract v1.0.5 project zip

permissions:
  contents: write
  workflows: write

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip v1.0.5 project
        run: |
          ls -la
          unzip -o photo-editor-tauri-v105.zip -d /tmp/extracted
          echo "--- extracted top level ---"
          ls -la /tmp/extracted
          echo "--- extracted tree ---"
          find /tmp/extracted -maxdepth 3 -print | head -n 120
      - name: Copy extracted files into repo root
        run: |
          if [ -f /tmp/extracted/package.json ]; then
            cp -a /tmp/extracted/. ./
          fi
          for d in photo-editor-tauri-v105 photo-editor-tauri photo-editor-v105; do
            if [ -d "/tmp/extracted/$d" ]; then
              cp -a "/tmp/extracted/$d/." ./
            fi
          done
          rm -rf __MACOSX .DS_Store */__MACOSX */.DS_Store 2>/dev/null || true
          find . -name '__MACOSX' -type d -exec rm -rf {} + 2>/dev/null || true
          find . -name '.DS_Store' -delete 2>/dev/null || true
          echo "--- repo root after copy ---"
          ls -la
          echo "--- file count ---"
          find . -path ./.git -prune -o -type f -print | sort
      - name: Verify v1.0.5 contents
        run: |
          set -x
          test -f package.json
          test -f src-tauri/Cargo.toml
          test -f src-tauri/tauri.conf.json
          grep -q '1.0.5' package.json
          grep -q '1.0.5' src-tauri/Cargo.toml
          grep -q '1.0.5' src-tauri/tauri.conf.json
          grep -q 'Mori Instrument' src-tauri/tauri.conf.json
          grep -q 'Graphics and Design' src-tauri/tauri.conf.json
          grep -q 'icon.ico' src-tauri/tauri.conf.json
          grep -A1 '^permissions:' .github/workflows/build-windows.yml | grep -q 'contents: write'
          grep -A1 '^permissions:' .github/workflows/build-macos.yml | grep -q 'contents: write'
          grep -q 'I18N' src/app.js
          grep -q 'applyLanguage' src/app.js
          grep -q 'mori-lang' src/app.js || grep -rq 'mori-lang' src/
          grep -q 'langModal' src/index.html
          grep -rq 'flex-shrink' src/ || true
          ls src/fonts/
          grep -rq 'auto_retouch_image' src-tauri/src/ || grep -rq 'auto_retouch_image' src-tauri/
          grep -rq 'btnAutoRetouch' src/ || true
          grep -rq 'whitenAt' src/ || true
          echo "--- tauri.conf.json ---"
          cat src-tauri/tauri.conf.json
          echo "--- diff of zip workflow files vs repo workflow files (before commit) ---"
          diff -u .github/workflows/build-windows.yml /tmp/extracted/.github/workflows/build-windows.yml || diff -u .github/workflows/build-windows.yml /tmp/extracted/photo-editor-tauri-v105/.github/workflows/build-windows.yml || diff -u .github/workflows/build-windows.yml /tmp/extracted/photo-editor-tauri/.github/workflows/build-windows.yml || true
          diff -u .github/workflows/build-macos.yml /tmp/extracted/.github/workflows/build-macos.yml || diff -u .github/workflows/build-macos.yml /tmp/extracted/photo-editor-tauri-v105/.github/workflows/build-macos.yml || diff -u .github/workflows/build-macos.yml /tmp/extracted/photo-editor-tauri/.github/workflows/build-macos.yml || true
          echo "--- extracted workflow files ---"
          ls -la /tmp/extracted/.github/workflows/ || ls -la /tmp/extracted/photo-editor-tauri-v105/.github/workflows/ || ls -la /tmp/extracted/photo-editor-tauri/.github/workflows/ || true
      - name: Commit extracted v1.0.5 files and tag v1.0.5
        run: |
          rm -f photo-editor-tauri-v105.zip
          git status --short
          git add -A
          git config user.name "m0riii"
          git config user.email "mori.jacobi@gmail.com"
          git commit -m "Photo editor v1.0.5: bilingual Persian/English UI (Mori Instrument)" || echo "nothing to commit"
          git push origin main || git push origin HEAD:main
          git tag v1.0.5 || echo "tag v1.0.5 already exists locally"
          git push origin v1.0.5
