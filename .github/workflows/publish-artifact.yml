name: Publish built installers to release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}
      - name: Download built installers from run 44228758056
        uses: actions/download-artifact@v4
        with:
          name: photo-editor-windows
          path: installers
          run-id: 44228758056
          github-token: ${{ secrets.PUSH_TOKEN }}
      - name: List installers
        run: find installers -type f -exec ls -lh {} \;
      - name: Upload installers to Release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          mapfile -t FILES < <(find installers -type f \( -name '*.msi' -o -name '*.exe' \))
          gh release upload v1.0.0 "${FILES[@]}" --clobber --repo m0riii/photo-editor-tauri
      - name: Show release assets
        env:
          GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: gh release view v1.0.0 --repo m0riii/photo-editor-tauri
      - name: Remove this workflow
        run: |
          rm .github/workflows/publish-artifact.yml
          git config user.name "m0riii"
          git config user.email "mori.jacobi@gmail.com"
          git add -A
          git commit -m "Remove temporary publish-artifact workflow" || echo "nothing to commit"
          git push
