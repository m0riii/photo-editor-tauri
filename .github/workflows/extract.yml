name: Extract project zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o photo-editor-tauri.zip
          rm photo-editor-tauri.zip
          for d in */; do if [ -f "$d/package.json" ] && [ -f "$d/src-tauri/Cargo.toml" ]; then shopt -s dotglob; mv "$d"* .; rmdir "$d"; break; fi; done
          rm -f .github/workflows/extract.yml
          ls -la
          find . -path ./.git -prune -o -type f -print | sort
      - name: Commit extracted files
        run: |
          git config user.name "m0riii"
          git config user.email "mori.jacobi@gmail.com"
          git add -A
          git status --short
          git commit -m "Add Tauri photo editor project files" || echo "nothing to commit"
          git push
