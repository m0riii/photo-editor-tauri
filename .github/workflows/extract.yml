name: Extract v1.0.2 project zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}
      - name: Unzip v1.0.2 project files
        run: |
          unzip -o photo-editor-tauri-v102.zip
          rm photo-editor-tauri-v102.zip
          for d in photo-editor-tauri photo-editor-tauri-v102; do
            if [ -d "$d" ]; then cp -a "$d/." .; rm -rf "$d"; fi
          done
          ls -la
          echo "--- tauri.conf.json ---"
          cat src-tauri/tauri.conf.json
          echo "--- versions ---"
          grep '"version"' package.json src-tauri/Cargo.toml
          echo "--- sidebar fix ---"
          grep -F 'flex-shrink' src/styles.css
          echo "--- workflow permissions ---"
          grep -A1 '^permissions:' .github/workflows/build-windows.yml
      - name: Remove this workflow and commit
        run: |
          rm .github/workflows/extract.yml
          git config user.name "m0riii"
          git config user.email "mori.jacobi@gmail.com"
          git add -A
          git status --short
          git commit -m "Update photo editor to v1.0.2" || echo "nothing to commit"
          git push
